    <g transform="translate(15 216)">
      <rect width="56" height="38" rx="5" fill="#FFFFFF" stroke="#E4EBE5" stroke-width=".4"/>
      <text x="6" y="11" font-size="6" font-weight="800" fill="#147D59">1</text>
      <text x="6" y="20" font-size="4.7" font-weight="800" fill="#28302D">Choose your area</text>
      <text x="6" y="27" font-size="3.9" fill="#5F6B64">Pick it from the list.</text>
      <text x="6" y="32.2" font-size="3.9" fill="#5F6B64">No sign-up needed.</text>
    </g>

    <g transform="translate(77 216)">
      <rect width="56" height="38" rx="5" fill="#FFFFFF" stroke="#E4EBE5" stroke-width=".4"/>
