<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#147D59">
  <meta name="description" data-i18n-content="app.description" content="">
  <title data-i18n="app.title">SetSetal</title>

  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <!-- All visible text comes from src/i18n/<locale>.json through data-i18n keys. -->
  <a class="skip-link" href="#main" data-i18n="app.skipLink"></a>

  <header class="topbar">
    <a class="brand" href="#/" data-i18n-aria-label="app.homeLink" data-go="home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <path d="M20 5 26 8 23 14 17 14 14 9Z"/>
          <path d="M29 15 34 24 28 28 24 22 26 17Z"/>
          <path d="M22 31 12 31 12 24 19 23 23 27Z"/>
          <path d="M11 21 6 12 12 9 16 16 14 21Z"/>
          <circle cx="20" cy="20" r="4" class="logo-hole"/>
        </svg>
      </span>
      <span>SetSetal</span>
    </a>
  </header>

  <main id="main" class="app-main">
    <section class="screen active" id="home" aria-labelledby="home-title">
      <h1 id="home-title" class="home-title" data-i18n="home.title"></h1>
      <div class="doors">
        <button class="door door-need" type="button" data-go="find">
          <span class="door-picture" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path d="M5 22 24 7l19 15v21H5z" fill="#E8B84A" stroke="#174B3A" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M19 43V30h9v13" fill="#FFFFFF" stroke="#174B3A" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M31 31h9l2 12H29z" fill="#28302D" stroke="#174B3A" stroke-width="2" stroke-linejoin="round"/>
              <path d="M33 31c0-3 1.3-5 2.5-5s2.5 2 2.5 5" fill="none" stroke="#174B3A" stroke-width="2"/>
            </svg>
          </span>
          <span class="door-text"><strong data-i18n="home.findCta"></strong><span data-i18n="home.findHint"></span></span>
        </button>
        <button class="door door-give" type="button" data-go="join">
          <span class="door-picture" aria-hidden="true">
            <svg viewBox="0 0 64 48" focusable="false">
              <path d="M2 23h32v10H2z" fill="#E8B84A" stroke="#174B3A" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M34 28h6" stroke="#174B3A" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M40 24h11l3-9 2-9 2 8 3 1-1 5h-4l-3 7v14M44 24v16" fill="#9A9087" stroke="#174B3A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
              <path d="M55 7l-1-5M58 8l1-5" stroke="#174B3A" stroke-width="2.6" stroke-linecap="round"/>
              <circle cx="13" cy="38" r="6" fill="#FFFFFF" stroke="#174B3A" stroke-width="2.6"/><circle cx="13" cy="38" r="1.6" fill="#174B3A"/>
            </svg>
          </span>
          <span class="door-text"><strong data-i18n="home.joinCta"></strong><span data-i18n="home.joinHint"></span></span>
        </button>
      </div>
      <button id="install-button" class="button secondary install-button" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="2" width="12" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v7m-3-3 3 3 3-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="install.button"></span>
      </button>
    </section>

    <section class="screen" id="find" aria-labelledby="find-title" hidden>
      <div class="page-heading"><h1 id="find-title" data-i18n="find.title"></h1></div>

      <div class="area-picker">
        <button id="area-button" class="area-button" type="button" aria-expanded="false" aria-controls="area-options">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#147D59"/></svg>
          <span class="area-button-text"><span class="area-button-label" data-i18n="find.area"></span><strong id="area-current"></strong></span>
          <span class="area-change" data-i18n="find.changeArea"></span>
        </button>
        <div id="area-options" class="area-options" hidden>
          <h2 id="area-options-title" class="area-options-title" data-i18n="find.areaQuestion"></h2>
          <div id="area-tiles" class="area-tiles" role="group" aria-labelledby="area-options-title"></div>
          <p class="small-note" data-i18n="find.locationNote"></p>
        </div>
      </div>

      <div id="vehicle-chips" class="vehicle-chips" role="group" data-i18n-aria-label="find.vehicle"></div>

      <p id="results-count" class="results-count" aria-live="polite"></p>
      <div id="collector-results" class="collector-list"></div>
    </section>

    <section class="screen" id="profile" aria-labelledby="profile-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="profile-title" data-i18n="profile.title"></h1>
      </div>
      <div id="profile-content"></div>
    </section>

    <section class="screen" id="join" aria-labelledby="join-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="join-title" data-i18n="join.title"></h1>
      </div>
      <p class="intro" data-i18n="join.intro"></p>

      <p id="join-loading" class="muted" hidden data-i18n="join.loading"></p>

      <div id="join-signin" class="panel form-panel" hidden>
        <form id="signin-phone-form">
          <h2 data-i18n="join.signin.title"></h2>
          <p id="signin-admin-note" class="notice" hidden data-i18n="join.signin.adminNote"></p>
          <p data-i18n="join.signin.body"></p>
          <label for="signin-phone" data-i18n="join.signin.phone"></label>
          <input id="signin-phone" name="phone" type="tel" autocomplete="tel" required maxlength="20" data-i18n-placeholder="join.signin.phonePlaceholder">
          <div id="signin-captcha"></div>
          <button id="signin-send" class="button primary" type="submit" data-i18n="join.signin.send"></button>
          <p class="small-note" data-i18n="join.signin.sharedNote"></p>
        </form>
        <form id="signin-code-form" hidden>
          <h2 data-i18n="join.signin.codeTitle"></h2>
          <p id="signin-code-sent"></p>
          <label for="signin-code" data-i18n="join.signin.code"></label>
          <input id="signin-code" name="code" inputmode="numeric" autocomplete="one-time-code" required pattern="[0-9]{6}" maxlength="6">
          <button id="signin-verify" class="button primary" type="submit" data-i18n="join.signin.verify"></button>
          <button id="signin-change" class="text-button" type="button" data-i18n="join.signin.change"></button>
        </form>
        <div id="signin-feedback" class="feedback" role="status" hidden></div>
      </div>

      <div id="my-listing" hidden></div>

      <form id="registration-form" class="panel form-panel" hidden>
        <label for="provider-name"><span data-i18n="join.name"></span> <span class="required">*</span></label>
        <input id="provider-name" name="name" autocomplete="organization" required minlength="2" maxlength="80" data-i18n-placeholder="join.namePlaceholder">

        <label for="provider-phone"><span data-i18n="join.phone"></span> <span class="required">*</span></label>
        <input id="provider-phone" name="phone" type="tel" autocomplete="tel" required maxlength="25" data-i18n-placeholder="join.phonePlaceholder">

        <label for="provider-whatsapp" data-i18n="join.whatsapp"></label>
        <input id="provider-whatsapp" name="whatsapp" type="tel" maxlength="25" data-i18n-placeholder="join.whatsappPlaceholder">

        <label for="provider-vehicle"><span data-i18n="join.vehicle"></span> <span class="required">*</span></label>
        <select id="provider-vehicle" name="vehicle" required>
          <option value="" data-i18n="join.vehicleChoose"></option>
        </select>

        <fieldset id="provider-areas" class="checkbox-group">
          <legend><span data-i18n="join.areas.legend"></span> <span class="required">*</span></legend>
          <div id="provider-area-options"></div>
          <p id="provider-areas-error" class="field-error" role="alert" hidden data-i18n="join.areas.error"></p>
        </fieldset>

        <fieldset id="provider-waste" class="checkbox-group">
          <legend><span data-i18n="join.waste.legend"></span> <span class="required">*</span></legend>
          <div id="provider-waste-options"></div>
          <p id="provider-waste-error" class="field-error" role="alert" hidden data-i18n="join.waste.error"></p>
        </fieldset>

        <label for="provider-description" data-i18n="join.description"></label>
        <textarea id="provider-description" name="description" rows="3" maxlength="500" data-i18n-placeholder="join.descriptionPlaceholder"></textarea>

        <label class="checkbox-row">
          <input id="provider-consent" type="checkbox" name="consent">
          <span data-i18n="join.consent"></span>
        </label>
        <p class="small-note" data-i18n="join.consentNote"></p>
        <p class="small-note"><a href="#/privacy" data-go="privacy" data-i18n="privacy.link"></a></p>

        <button class="button primary" type="submit" data-i18n="join.submit"></button>
        <p class="small-note" data-i18n="join.reviewNote"></p>
      </form>
      <div id="registration-feedback" class="feedback" role="status" hidden></div>
      <div id="signed-in" hidden>
        <p id="signed-in-as" class="small-note"></p>
        <button id="sign-out" class="button secondary full-width" type="button" data-i18n="join.signOut"></button>
        <button id="delete-account" class="text-button danger" type="button" data-i18n="join.delete.button"></button>
        <div id="delete-confirm" class="notice" role="group" aria-labelledby="delete-confirm-title" hidden>
          <strong id="delete-confirm-title" data-i18n="join.delete.title"></strong>
          <p data-i18n="join.delete.body"></p>
          <div class="card-actions">
            <button id="delete-confirm-yes" class="button danger" type="button" data-i18n="join.delete.confirm"></button>
            <button id="delete-cancel" class="button secondary" type="button" data-i18n="join.delete.cancel"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="preview" aria-labelledby="preview-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="preview-title" data-i18n="preview.title"></h1>
      </div>
      <div id="preview-content"></div>
      <div id="preview-feedback" class="feedback" role="status" hidden></div>
      <button class="button secondary full-width" data-back data-i18n="preview.edit"></button>
      <button class="button primary full-width" id="submit-listing" type="button" data-i18n="preview.submit"></button>
    </section>

    <section class="screen" id="help" aria-labelledby="help-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="help-title" data-i18n="help.title"></h1>
      </div>
      <div class="panel">
        <h2 data-i18n="help.using.title"></h2>
        <p data-i18n="help.using.body"></p>
        <p id="help-listings-note" data-i18n="help.using.demo"></p>
      </div>
      <form id="report-form" class="panel form-panel report-form" novalidate>
        <h2 data-i18n="help.report.title"></h2>
        <div id="report-target" class="report-target" hidden></div>
        <fieldset class="reason-group" aria-describedby="report-type-error">
          <legend data-i18n="help.report.type"></legend>
          <p id="report-type-error" class="field-error reason-error" hidden data-i18n="help.report.chooseReason"></p>
          <div id="report-reasons" class="reason-tiles"></div>
        </fieldset>
        <label for="report-message" data-i18n="help.report.details"></label>
        <textarea id="report-message" name="message" maxlength="1000" rows="3" data-i18n-placeholder="help.report.detailsPlaceholder"></textarea>
        <button id="report-submit" class="button primary send-button" type="submit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11.5 21 3l-6.5 18-3-7.5z" fill="currentColor"/><path d="m11.5 13.5 4-4" stroke="#147D59" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="report-submit-label" data-i18n="help.report.submit"></span>
        </button>
        <p class="small-note" data-i18n="help.report.privacy"></p>
      </form>
      <div id="report-feedback" class="feedback" role="status" hidden></div>
      <button class="button secondary full-width" type="button" data-go="privacy" data-i18n="privacy.link"></button>
    </section>

    <section class="screen" id="privacy" aria-labelledby="privacy-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="privacy-title" data-i18n="privacy.title"></h1>
      </div>
      <p class="intro" data-i18n="privacy.intro"></p>
      <div class="panel prose">
        <h2 data-i18n="privacy.residents.title"></h2>
        <p data-i18n="privacy.residents.body"></p>
        <p data-i18n="privacy.residents.reports"></p>
        <p data-i18n="privacy.residents.counts"></p>
      </div>
      <div class="panel prose">
        <h2 data-i18n="privacy.collectors.title"></h2>
        <p data-i18n="privacy.collectors.body"></p>
        <p data-i18n="privacy.collectors.consent"></p>
        <p data-i18n="privacy.collectors.delete"></p>
      </div>
      <div class="panel prose">
        <h2 data-i18n="privacy.phone.title"></h2>
        <p data-i18n="privacy.phone.body"></p>
      </div>
      <div class="panel prose">
        <h2 data-i18n="privacy.keep.title"></h2>
        <p data-i18n="privacy.keep.body"></p>
      </div>
      <div class="panel prose">
        <h2 data-i18n="privacy.who.title"></h2>
        <p data-i18n="privacy.who.body"></p>
        <p data-i18n="privacy.who.contact"></p>
      </div>
      <p class="small-note" data-i18n="privacy.updated"></p>
    </section>

    <section class="screen" id="admin" aria-labelledby="admin-title" hidden>
      <div class="page-heading">
        <button class="back-button" type="button" data-back data-i18n-aria-label="app.back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 id="admin-title" data-i18n="admin.title"></h1>
      </div>
      <div id="admin-content"></div>
    </section>
  </main>

  <nav class="bottom-nav" data-i18n-aria-label="nav.label">
    <button class="nav-item active" data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/></svg>
      <span data-i18n="nav.home"></span>
    </button>
    <button class="nav-item" data-go="find">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <span data-i18n="nav.find"></span>
    </button>
    <button class="nav-item" data-go="join">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v8M15 12h8"/></svg>
      <span data-i18n="nav.join"></span>
    </button>
    <button class="nav-item" data-go="help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.3 1.5c-1.2 1.1-2 1.4-2 3M12 17h.01"/></svg>
      <span data-i18n="nav.help"></span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <footer class="site-footer">
    <span data-i18n="app.footer"></span>
    <a href="#/privacy" data-go="privacy" data-i18n="privacy.link"></a>
  </footer>
</body>
</html>
